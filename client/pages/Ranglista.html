<div style="text-align:center; padding: 32px 0 20px; color: var(--text);">
  <div id="ranglista-body"></div>
</div>

<script>
  (function() {
    var HUNGARIAN_MONTHS = [
      'Január', 'Február', 'Március', 'Április', 'Május', 'Június',
      'Július', 'Augusztus', 'Szeptember', 'Október', 'November', 'December'
    ];

    var CATEGORIES = [
      { key: 'hoursPlanned', emoji: '⏱️', label: 'Munkaidő', unit: 'óra', getValue: function(s) { return s.hoursPlanned; } },
      { key: 'daysWorked', emoji: '📅', label: 'Munka napok', unit: 'nap', getValue: function(s) { return s.daysWorked; } },
      { key: 'avgShiftHours', emoji: '📏', label: 'Átlagos műszakhossz', unit: 'óra', getValue: function(s) { return s.avgShiftHours; } },
      { key: 'blendedRate', emoji: '💰', label: 'Átlag Ft/óra', unit: 'Ft/óra', getValue: function(s) { return s.hoursPlanned ? s.payPlanned / s.hoursPlanned : 0; } },
      { key: 'sundaysWorked', emoji: '☀️', label: 'Vasárnapok', unit: 'nap', getValue: function(s) { return s.sundaysWorked; } },
      { key: 'longestStreak', emoji: '🔥', label: 'Leghosszabb sorozat', unit: 'nap', getValue: function(s) { return s.longestStreak; } }
    ];

    var TOGGLE_ITEMS = CATEGORIES.concat([
      { key: 'favoriteArea', emoji: '⭐', label: 'Kedvenc terület' }
    ]);

    function tabNameForDate(date) {
      return date.getFullYear() + ' ' + HUNGARIAN_MONTHS[date.getMonth()];
    }

    function formatValue(category, stats) {
      var value = category.getValue(stats);

      if (category.key === 'hoursPlanned') {
        var pay = Math.round(stats.payPlanned).toLocaleString('hu-HU');
        return value + ' óra <span style="color:var(--text-dim); font-size:0.85em;">(' + pay + ' Ft)</span>';
      }
      if (category.key === 'avgShiftHours') value = value.toFixed(1);
      else if (category.key === 'blendedRate') value = Math.round(value).toLocaleString('hu-HU');
      return value + ' ' + category.unit;
    }

    /**
     * Same as formatValue, but for the "Összesen" total row: daysWorked and
     * sundaysWorked are counts summed across every employee, so e.g.
     * "213 nap" would misleadingly read as 213 calendar days - "alkalom"
     * (occurrence) is accurate there. Per-employee rows keep "nap" as-is.
     */
    function formatTotalValue(category, stats) {
      if (category.key === 'daysWorked' || category.key === 'sundaysWorked') {
        return category.getValue(stats) + ' alkalom';
      }
      return formatValue(category, stats);
    }

    /**
     * Builds a synthetic "whole company as one person" stats object for the
     * Ranglista total row: hoursPlanned/payPlanned/daysWorked/sundaysWorked
     * are summed (so blendedRate, which derives from payPlanned/hoursPlanned,
     * comes out correct automatically without special-casing it here),
     * avgShiftHours is averaged across employees, longestStreak is the max
     * across employees (a "combined streak" wouldn't mean anything), and
     * favoriteArea is whichever area is most employees' favorite.
     */
    function computeTotalStats(rows) {
      var total = { hoursPlanned: 0, payPlanned: 0, daysWorked: 0, sundaysWorked: 0, longestStreak: 0, avgShiftHours: 0 };
      var areaCounts = {};

      rows.forEach(function(s) {
        total.hoursPlanned += s.hoursPlanned;
        total.payPlanned += s.payPlanned;
        total.daysWorked += s.daysWorked;
        total.sundaysWorked += s.sundaysWorked;
        total.longestStreak = Math.max(total.longestStreak, s.longestStreak);
        total.avgShiftHours += s.avgShiftHours;
        if (s.favoriteArea) areaCounts[s.favoriteArea] = (areaCounts[s.favoriteArea] || 0) + 1;
      });

      total.avgShiftHours = rows.length ? total.avgShiftHours / rows.length : 0;

      var favoriteArea = null;
      var favoriteCount = 0;
      Object.keys(areaCounts).forEach(function(area) {
        if (areaCounts[area] > favoriteCount) {
          favoriteArea = area;
          favoriteCount = areaCounts[area];
        }
      });
      total.favoriteArea = favoriteArea;

      return total;
    }

    // See Home.html for why this guard exists - a background preload render
    // must not steal appState.activePageController from the visible page.
    var mountedInApp = document.getElementById('app').contains(document.getElementById('ranglista-body'));
    if (mountedInApp) appState.activePageController = null;

    getHasAccessCached(function(hasAccess) {
      if (!hasAccess) {
        document.getElementById('ranglista-body').innerHTML = renderNoAccessMessageHtml();
        return;
      }

      getDiakNeveCached(function(name) {
        renderRanglistaCard(name);
      });
    });

    function renderRanglistaCard(studentName) {
      document.getElementById('ranglista-body').innerHTML = `
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:10px; width:100%; margin:0 auto; padding:18px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            ${arrowButtonHtml('month-prev', 'prev')}
            <span id="month-title" style="font-weight:700; font-size:1.15rem;"></span>
            ${arrowButtonHtml('month-next', 'next')}
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap;">
            <select id="sort-select" style="background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:0.9rem;"></select>
            <button id="sort-direction" title="Sorrend váltása" style="background:none; border:1px solid var(--border); color:var(--text); cursor:pointer; padding:6px 10px; border-radius:6px; display:flex;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>
          <div id="column-toggles" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;"></div>
          <div id="ranglista-table" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border); text-align:left; overflow-x:auto;"></div>
        </div>
      `;

      var today = new Date();
      var previousMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      var nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      var months = [tabNameForDate(previousMonth), tabNameForDate(today), tabNameForDate(nextMonth)];

      var index = 1; // default to the current month
      var sortKey = CATEGORIES[0].key;
      var sortDescending = true;
      var visibleColumns = {};
      TOGGLE_ITEMS.forEach(function(item) { visibleColumns[item.key] = true; });

      var titleEl = document.getElementById('month-title');
      var tableEl = document.getElementById('ranglista-table');
      var prevBtn = document.getElementById('month-prev');
      var nextBtn = document.getElementById('month-next');
      var sortSelect = document.getElementById('sort-select');
      var sortDirBtn = document.getElementById('sort-direction');
      var togglesEl = document.getElementById('column-toggles');

      CATEGORIES.forEach(function(cat) {
        var option = document.createElement('option');
        option.value = cat.key;
        option.textContent = cat.emoji + ' ' + cat.label;
        sortSelect.appendChild(option);
      });

      function renderToggleChips() {
        togglesEl.innerHTML = TOGGLE_ITEMS.map(function(item) {
          var isOn = visibleColumns[item.key];
          var style = 'font-size:0.75rem; padding:4px 10px; border-radius:20px; cursor:pointer; border:1px solid ' +
            (isOn ? 'var(--accent)' : 'var(--border)') + ';' +
            (isOn ? ' background:rgba(0,130,195,0.15); color:var(--accent);' : ' background:none; color:var(--text-dim);');
          return '<button class="col-toggle" data-key="' + item.key + '" style="' + style + '">' + item.emoji + ' ' + item.label + '</button>';
        }).join('');

        togglesEl.querySelectorAll('.col-toggle').forEach(function(btn) {
          btn.addEventListener('click', function() {
            visibleColumns[btn.dataset.key] = !visibleColumns[btn.dataset.key];
            renderToggleChips();
            if (months[index] in leaderboardCache) renderTable(leaderboardCache[months[index]]);
          });
        });
      }
      renderToggleChips();

      var leaderboardCache = appState.leaderboardCache;
      var requestToken = 0;

      function renderTable(rows) {
        if (!rows || !rows.length) {
          tableEl.innerHTML = '<p style="color:var(--text-dim); margin:0;">Nincs adat erre a hónapra.</p>';
          return;
        }

        var category = CATEGORIES.filter(function(c) { return c.key === sortKey; })[0];
        var visibleCategories = CATEGORIES.filter(function(c) { return visibleColumns[c.key] || c.key === sortKey; });
        var orderedCategories = [category].concat(visibleCategories.filter(function(c) { return c.key !== sortKey; }));

        var sorted = rows.slice().sort(function(a, b) {
          var diff = category.getValue(a) - category.getValue(b);
          return sortDescending ? -diff : diff;
        });

        var headerCells =
          '<th style="padding:8px 0 8px 10px; text-align:left; white-space:nowrap;">#</th>' +
          '<th style="padding:8px 10px; text-align:left; white-space:nowrap;">Név</th>' +
          orderedCategories.map(function(c) {
            var isSortedBy = c.key === sortKey;
            var style = 'padding:8px 10px; text-align:right; white-space:nowrap;' +
              (isSortedBy ? ' color:var(--accent); font-weight:700;' : ' color:var(--text-dim);');
            return '<th style="' + style + '">' + c.emoji + ' ' + c.label + '</th>';
          }).join('') +
          (visibleColumns.favoriteArea ? '<th style="padding:8px 10px; text-align:right; white-space:nowrap; color:var(--text-dim);">⭐ Kedvenc terület</th>' : '');

        var bodyRows = sorted.map(function(stats, i) {
          var isMe = stats.name === studentName;
          var rowStyle = 'border-top:1px solid var(--border);' + (isMe ? ' background:rgba(0,130,195,0.12);' : '');
          return '<tr style="' + rowStyle + '">' +
            '<td style="padding:8px 0 8px 10px; white-space:nowrap;">' + (i + 1) + '</td>' +
            '<td style="padding:8px 10px; white-space:nowrap; font-weight:' + (isMe ? '700' : '400') + ';">' + escapeHtml(stats.name) + '</td>' +
            orderedCategories.map(function(c) {
              var isSortedBy = c.key === sortKey;
              var style = 'padding:8px 10px; text-align:right; white-space:nowrap;' + (isSortedBy ? ' font-weight:600;' : '');
              return '<td style="' + style + '">' + formatValue(c, stats) + '</td>';
            }).join('') +
            (visibleColumns.favoriteArea ? '<td style="padding:8px 10px; text-align:right; white-space:nowrap; color:var(--text-dim);">' + escapeHtml(stats.favoriteArea || '-') + '</td>' : '') +
          '</tr>';
        }).join('');

        // Always the last row, regardless of sort direction/column - the
        // "whole company as one person" total, distinct from the "isMe"
        // highlight so the two never look like the same kind of row.
        var totalStats = computeTotalStats(rows);
        var totalRow =
          '<tr style="border-top:2px solid var(--accent); background:rgba(245,158,11,0.12); font-weight:700;">' +
            '<td style="padding:8px 0 8px 10px; white-space:nowrap; color:var(--text-dim);">–</td>' +
            '<td style="padding:8px 10px; white-space:nowrap;">Összesen</td>' +
            orderedCategories.map(function(c) {
              return '<td style="padding:8px 10px; text-align:right; white-space:nowrap;">' + formatTotalValue(c, totalStats) + '</td>';
            }).join('') +
            (visibleColumns.favoriteArea ? '<td style="padding:8px 10px; text-align:right; white-space:nowrap;">' + escapeHtml(totalStats.favoriteArea || '-') + '</td>' : '') +
          '</tr>';

        tableEl.innerHTML =
          '<table style="border-collapse:collapse;">' +
            '<thead><tr>' + headerCells + '</tr></thead>' +
            '<tbody>' + bodyRows + totalRow + '</tbody>' +
          '</table>';
      }

      function fetchIntoCache(tabName) {
        return runScript('getLeaderboard', tabName).then(function(rows) {
          leaderboardCache[tabName] = rows;
          return rows;
        });
      }

      function render() {
        var tabName = months[index];
        var myToken = ++requestToken;

        titleEl.textContent = tabName;
        setButtonState(prevBtn, index <= 0);
        setButtonState(nextBtn, index >= months.length - 1);

        if (tabName in leaderboardCache) {
          renderTable(leaderboardCache[tabName]);
        } else {
          tableEl.innerHTML = '<p style="color:var(--text-dim); margin:0;">Betöltés…</p>';
        }

        fetchIntoCache(tabName).then(function(rows) {
          if (myToken === requestToken) renderTable(rows);
        });
      }

      prevBtn.addEventListener('click', function() {
        if (index > 0) { index--; render(); }
      });

      nextBtn.addEventListener('click', function() {
        if (index < months.length - 1) { index++; render(); }
      });

      sortSelect.addEventListener('change', function() {
        sortKey = sortSelect.value;
        if (months[index] in leaderboardCache) renderTable(leaderboardCache[months[index]]);
      });

      sortDirBtn.addEventListener('click', function() {
        sortDescending = !sortDescending;
        sortDirBtn.style.transform = sortDescending ? 'none' : 'rotate(180deg)';
        if (months[index] in leaderboardCache) renderTable(leaderboardCache[months[index]]);
      });

      months.forEach(function(tabName) {
        if (!(tabName in leaderboardCache)) {
          fetchIntoCache(tabName).catch(function() {});
        }
      });

      if (mountedInApp) appState.activePageController = render;

      render();
    }
  })();
</script>
